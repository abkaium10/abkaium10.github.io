<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero Code Card Preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b12;color:#e8eaf5;font:16px/1.6 system-ui,sans-serif;min-height:100vh;overflow-x:hidden}.grid{position:fixed;inset:0;background-image:linear-gradient(#22253855 1px,transparent 1px),linear-gradient(90deg,#22253855 1px,transparent 1px);background-size:56px 56px;mask-image:linear-gradient(#000,transparent 90%);pointer-events:none}.hero{position:relative;max-width:1180px;margin:auto;min-height:100vh;padding:100px 28px;display:grid;grid-template-columns:1.05fr .95fr;gap:42px;align-items:center}.eyebrow{color:#a9afff;border:1px solid #454b7a;border-radius:99px;padding:5px 12px;font-size:12px}.intro h1{font:clamp(54px,7vw,92px)/1.05 Georgia,serif;letter-spacing:-3px;margin:24px 0}.intro h2{font-weight:450;font-size:clamp(20px,2.5vw,30px)}em{font-style:normal;color:#9ba1ff}.intro p{color:#9da4bb;max-width:490px}.btn{display:inline-block;padding:11px 20px;border-radius:12px;border:1px solid #3b4054;margin:12px 8px 0 0;color:#e7e9f5;text-decoration:none}.primary{background:#9299ff;color:#101225;border-color:transparent}.card-wrap{perspective:1200px;position:relative}.glow{position:absolute;inset:12% -5% -8%;border-radius:40%;background:radial-gradient(ellipse,#6b63ff55,transparent 68%);filter:blur(26px)}.card{position:relative;overflow:hidden;border:1px solid #5555a1;border-radius:16px;background:linear-gradient(145deg,#101426f5,#090c18f7);box-shadow:0 28px 70px -36px #000d,inset 0 1px #ffffff12;color:#e4e8fa;transform:rotateX(var(--x,0deg)) rotateY(var(--y,0deg));transition:transform .22s,border-color .3s,box-shadow .3s}.card:hover{border-color:#a5a7ff;box-shadow:0 34px 82px -35px #766cff77}.top{height:44px;display:flex;align-items:center;gap:12px;padding:0 13px;border-bottom:1px solid #ffffff12}.lights{display:flex;gap:6px}.lights i{width:8px;height:8px;border-radius:50%;background:#ff6b75}.lights i:nth-child(2){background:#ffc15b}.lights i:nth-child(3){background:#65d9a0}.file{font:11px monospace;color:#a9b1d0}.copy{margin-left:auto;border:1px solid #ffffff19;border-radius:6px;background:#ffffff07;color:#c9cffa;padding:4px 8px;cursor:pointer}.tabs{display:flex;gap:5px;padding:10px 12px 0;border-bottom:1px solid #ffffff0d}.tabs button{border:0;border-radius:7px 7px 0 0;background:transparent;color:#7f89a9;padding:7px 12px;font:11px monospace;cursor:pointer}.tabs button.active{background:#7d82ff19;color:#bfc3ff;box-shadow:inset 0 -2px #969bff}.code{margin:0;padding:16px 0 18px;min-height:275px;max-height:330px;overflow:auto;font:12px/1.85 ui-monospace,monospace;color:#dce2ff}.line{display:grid;grid-template-columns:38px minmax(0,1fr);padding-right:12px;white-space:pre}.line b{padding-right:12px;text-align:right;color:#515b7d;font-weight:400}.line:nth-child(4n+2) span{color:#c7a8ff}.line:nth-child(4n+3) span{color:#a8dca9}.line:nth-child(4n+4) span{color:#e9c18b}.foot{display:flex;justify-content:space-between;padding:10px 14px;border-top:1px solid #ffffff12;color:#7f89a9;font-size:10px}.live{color:#57dda1}@media(max-width:800px){.hero{grid-template-columns:1fr;padding:60px 22px;gap:30px}.card-wrap{max-width:560px;width:100%;margin:auto}.intro h1{letter-spacing:-2px}.code{min-height:220px}}@media(prefers-reduced-motion:reduce){.card{transition:none;transform:none!important}}
</style></head><body><div class="grid"></div><main class="hero"><section class="intro"><span class="eyebrow">● AVAILABLE FOR OPPORTUNITIES</span><h1>Abdul Kaium</h1><h2>I am a <em>Full Stack Developer</em></h2><p>I build fast, accessible web products with modern tools, thoughtful architecture and delightful user experiences.</p><a class="btn primary" href="#code">View my work →</a><a class="btn" href="#code">Explore code</a></section><aside class="card-wrap" id="code"><div class="glow"></div><div class="card" id="card"><div class="top"><div class="lights"><i></i><i></i><i></i></div><span class="file" id="file">React · Component</span><button class="copy" id="copy">Copy</button></div><div class="tabs" id="tabs"></div><pre class="code" id="codeview"></pre><div class="foot"><span><i class="live">●</i> Live snippet</span><span>Interactive preview <b style="color:#aeb2ff">↗</b></span></div></div></aside></main><script>
const examples={React:{label:'React · Component',code:`function ProjectCard({ project }) {\n  const [saved, setSaved] = useState(false);\n\n  return (\n    <article className="project-card">\n      <h3>{project.title}</h3>\n      <p>{project.description}</p>\n      <button onClick={() => setSaved(!saved)}>\n        {saved ? 'Saved ✓' : 'Save project'}\n      </button>\n    </article>\n  );\n}`},API:{label:'Node.js · API',code:`export async function GET() {\n  const projects = await getProjects();\n\n  return Response.json(\n    {\n      data: projects,\n      count: projects.length,\n      success: true,\n    },\n    { headers: { 'Cache-Control': 'no-store' } }\n  );\n}`},Types:{label:'TypeScript · Types',code:`type Project = {\n  id: string;\n  title: string;\n  description: string;\n  stack: string[];\n  status: 'building' | 'shipped';\n};\n\nfunction isShipped(project: Project) {\n  return project.status === 'shipped';\n}`}};let active='React';function render(){document.querySelector('#file').textContent=examples[active].label;document.querySelector('#tabs').innerHTML=Object.keys(examples).map(k=>`<button class="${k===active?'active':''}" data-key="${k}">${k}</button>`).join('');document.querySelector('#codeview').innerHTML=examples[active].code.split('\n').map((l,i)=>`<span class="line"><b>${String(i+1).padStart(2,'0')}</b><span>${l.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')||' '}</span></span>`).join('');document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{active=b.dataset.key;render()})}render();document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(examples[active].code);document.querySelector('#copy').textContent='Copied ✓';setTimeout(()=>document.querySelector('#copy').textContent='Copy',1400)}catch{document.querySelector('#copy').textContent='Select code'}};const card=document.querySelector('#card');card.onmousemove=e=>{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const r=card.getBoundingClientRect();card.style.setProperty('--x',`${((e.clientY-r.top)/r.height-.5)*-8}deg`);card.style.setProperty('--y',`${((e.clientX-r.left)/r.width-.5)*10}deg`)};card.onmouseleave=()=>{card.style.setProperty('--x','0deg');card.style.setProperty('--y','0deg')};
</script></body></html>
