name: Lighthouse performance budget
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency: { group: 'lighthouse-${{ github.ref }}', cancel-in-progress: true }
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Derive static hosting path
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"; REPO="${GITHUB_REPOSITORY#*/}"
          if [ "${REPO,,}" = "${OWNER,,}.github.io" ]; then echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"; else echo "NEXT_PUBLIC_BASE_PATH=/${REPO}" >> "$GITHUB_ENV"; fi
      - name: Install reproducible dependencies
        run: npm ci
      - name: Build static export
        run: npm run build
      - name: Install Lighthouse CI CLI
        run: npm install --no-save @lhci/cli
      - name: Run Lighthouse CI
        run: npx lhci autorun --config=lighthouserc.js
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: artifacts/lighthouse
          if-no-files-found: warn
